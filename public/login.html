<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - GastoSmart</title>
    <script src="/assets/vendor/tailwind.min.js"></script>
    <script src="/assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-baseBg font-sans text-textMain flex items-center justify-center min-h-screen p-4 antialiased selection:bg-primary/25">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-emerald-950/5 p-8 border border-surfaceBorder relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <a href="/index.html" class="inline-flex items-center justify-center gap-2 mb-3">
                <img src="/logo.png" alt="GastoSmart" class="w-12 h-12 object-contain" onerror="this.src='https://placehold.co/48x48/10b981/ffffff?text=GS'">
                <span class="font-display font-extrabold text-2xl tracking-tight text-textMain">GastoSmart</span>
            </a>
            <h2 class="font-display font-extrabold text-2xl text-textMain">Bienvenido de nuevo</h2>
            <p class="text-textMuted text-sm mt-1">Ingresa para administrar tus gastos y finanzas</p>
        </div>

        <!-- Error Msg -->
        <div id="error-msg" class="hidden mb-5 p-3.5 bg-rose-50 text-rose-700 text-sm rounded-xl border border-rose-200 flex items-center gap-2">
            <i class="fas fa-exclamation-circle text-base text-rose-500"></i>
            <span id="error-text">Credenciales inválidas</span>
        </div>

        <!-- Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-textLight mb-1.5">Correo Electrónico</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-textLight">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required placeholder="tu@correo.com"
                        class="w-full pl-10 pr-4 py-3 bg-surfaceSoft border border-surfaceBorder rounded-xl focus:ring-2 focus:ring-primary/40 focus:bg-white outline-none transition text-sm font-semibold text-textMain">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-textLight mb-1.5">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-textLight">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-3 bg-surfaceSoft border border-surfaceBorder rounded-xl focus:ring-2 focus:ring-primary/40 focus:bg-white outline-none transition text-sm font-semibold text-textMain">
                </div>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full bg-gradient-to-r from-primary via-emerald-600 to-secondary hover:from-primaryHover hover:to-teal-700 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/25 transition-all duration-200 flex items-center justify-center gap-2 mt-6">
                <span>Ingresar al Sistema</span>
                <i class="fas fa-arrow-right text-sm"></i>
            </button>
        </form>

        <p class="text-center mt-6 text-sm text-textMuted">
            ¿No tienes cuenta? <a href="/register.html" class="text-secondary font-extrabold hover:underline">Regístrate gratis</a>
        </p>

        <!-- Test credentials helper -->
        <div class="mt-6 p-4 bg-emerald-50/70 border border-emerald-200/80 rounded-2xl">
            <div class="flex items-center gap-2 text-xs font-black text-secondary mb-2">
                <i class="fas fa-key"></i>
                <span>Cuentas de Prueba (Clic para autocompletar):</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" onclick="fillCreds('demo@gastos.com', 'password123')"
                    class="p-2.5 bg-white border border-emerald-200 rounded-xl text-textMain hover:bg-emerald-100/60 text-left transition shadow-sm">
                    <div class="font-extrabold text-secondary">Usuario Demo</div>
                    <div class="text-[10px] text-textMuted font-medium">demo@gastos.com</div>
                </button>
                <button type="button" onclick="fillCreds('admin@gastos.com', 'password123')"
                    class="p-2.5 bg-white border border-emerald-200 rounded-xl text-textMain hover:bg-emerald-100/60 text-left transition shadow-sm">
                    <div class="font-extrabold text-primaryHover">Administrador</div>
                    <div class="text-[10px] text-textMuted font-medium">admin@gastos.com</div>
                </button>
            </div>
        </div>

        <!-- Footer Links Académicos -->
        <div class="mt-6 pt-4 border-t border-surfaceBorder text-center text-xs text-textMuted flex items-center justify-center gap-3">
            <a href="/terminos.html" class="hover:text-primary transition-colors">Términos</a>
            <span>•</span>
            <a href="/sobre-nosotros.html" class="hover:text-primary transition-colors">Nosotros</a>
            <span>•</span>
            <a href="/soporte.html" class="hover:text-primary transition-colors">Soporte</a>
        </div>
    </div>

    <script src="/assets/js/auth.js"></script>
    <script>
        Auth.checkSession(false);

        function fillCreds(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errBox = document.getElementById('error-msg');
            const errText = document.getElementById('error-text');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Autenticando...';
            errBox.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await Auth.login(email, password);
                if (res.success) {
                    window.location.href = res.user?.rol === 'admin' ? '/admin.html' : '/dashboard.html';
                } else {
                    errText.textContent = res.message || 'Error al iniciar sesión';
                    errBox.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Ingresar al Sistema</span> <i class="fas fa-arrow-right text-sm"></i>';
                }
            } catch (err) {
                errText.textContent = 'Error de conexión con el servidor';
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Ingresar al Sistema</span> <i class="fas fa-arrow-right text-sm"></i>';
            }
        });
    </script>
</body>
</html>
